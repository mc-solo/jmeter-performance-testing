# JMeter user properties for this repo.
#
# Load with:  jmeter -p config/user.properties -n -t test-plans/load-test.jmx ...
# Any property can be overridden on the command line with -J<name>=<value>,
# which takes precedence over this file. If a property is set nowhere, the
# .jmx files fall back to the second value in each ${__P(name,default)}.
#
# Target API (public fake API, no real data is created)
host=jsonplaceholder.typicode.com
protocol=https
port=443

# Timeouts in milliseconds, applied in HTTP Request Defaults.
connect.timeout=5000
response.timeout=30000

# Load test thread group (test-plans/load-test.jmx)
load.threads=10
load.rampup=10
load.loops=5

# Stress test thread group (test-plans/stress-test.jmx)
stress.threads=50
stress.rampup=30
stress.loops=10

# Response-time threshold in milliseconds.
# NOTE: this is documentation only. JMeter's Duration Assertion reads its
# value as a plain number and does not evaluate ${__P(...)} there, so the
# assertion in both .jmx files uses the literal 5000. If you change this
# value, update the Duration Assertion in the .jmx files to match.
duration.max.ms=5000

# Response assertions (in the .jmx files, per sampler):
#   GET /posts          200, body contains "userId" and "title", under duration.max.ms
#   GET /posts/${postId} 200, body contains "userId": ${userId}, "title" and "body",
#                       under duration.max.ms
#   POST /posts         201, created body echoes "title": "${title}" and
#                       "userId": ${userId}, under duration.max.ms
# The expected field names are fixed by the API contract; the values
# (${userId}, ${title}) come from test-data/users.csv, not from here.
